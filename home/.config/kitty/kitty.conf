# Nerd Font so Neovim/LazyVim icons render correctly (Meslo LG Nerd Font Mono
# ships with CachyOS; plain "monospace" resolves to Noto Sans Mono = tofu).
font_family      MesloLGS Nerd Font Mono
bold_font        MesloLGS Nerd Font Mono
italic_font      MesloLGS Nerd Font Mono
bold_italic_font MesloLGS Nerd Font Mono

background_opacity          0.6
cursor_trail                1
window_padding_width        25

include themes/noctalia.conf
include themes/wallpaper.conf
