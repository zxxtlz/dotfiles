# Omasnap — native Wayland capture + annotation for Hyprland.
# The capture overlay shows the frame grabbed before the overlay maps, so
# the screen is genuinely frozen while you pick a region.
[editor]
# Editor opens as a fullscreen overlay after the selection; it owns the
# Copy / Save / Copy+Save choice, so nothing is written unless asked.
mode = overlay

[output]
# Fresh captures must not be saved behind the user's back: copy-only has
# to stay copy-only. Explicit Save in the editor still writes here.
autosave = false
directory = ~/Pictures/Screenshots
