# The system must not change playback volume on its own.
#
# Duck-level is what WirePlumber's role-based linking policy applies to other
# streams when a higher-priority one (e.g. a phone call / notification role)
# starts playing: stock behavior drops them to 30%. Setting it to 1.0 makes
# any "duck" a no-op, so nothing ever lowers volume without the user asking.
#
# Bluetooth devices pushing AVRCP volume into the system is disabled
# separately, for the AirPods, in /usr/share/spa-0.2/bluez5/bluez-hardware.conf
# (first matching rule wins; ours is at the top of the device list).

wireplumber.settings = {
  linking.role-based.duck-level = 1.0
}
