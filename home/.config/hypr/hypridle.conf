# hypridle - idle ladder for the Hyprland session.
#
# 10 minutes without input: lock the screen (whichever shell is running), but
# first wait out any media playback. 5 minutes later: suspend. Any input before
# the suspend kills the pending guard, so returning to the machine never wakes
# it back up into a locked session that was about to sleep.
#
# hypridle honours Wayland idle inhibitors, so a fullscreen video or a game
# never starts this clock at all. The MPRIS check in session-idle catches
# players that keep running without inhibiting (a windowed video, music).
#
# Times are seconds.

general {
    # Used by a manual lock request through hypridle, and before a suspend
    # triggered by anything else (lid close, menu). Both are shell-aware and
    # return immediately.
    lock_cmd        = /home/zxx/.local/bin/session-lock
    before_sleep_cmd = /home/zxx/.local/bin/session-lock

    # Resume with the screen on: a suspend at the 15-minute mark would
    # otherwise leave the panel dark until the first key press.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout   = 600
    on-timeout = /home/zxx/.local/bin/session-idle guard
    on-resume  = /home/zxx/.local/bin/session-idle cancel
}
